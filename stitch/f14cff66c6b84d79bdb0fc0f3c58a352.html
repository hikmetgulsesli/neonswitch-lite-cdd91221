<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeonSwitch Lite - Gameplay</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config from Brand Anchors -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#151b2d",
                    "on-secondary-fixed-variant": "#62259b",
                    "on-tertiary-fixed": "#3d0026",
                    "on-primary": "#00363e",
                    "on-surface": "#dce1fb",
                    "surface": "#0c1324",
                    "inverse-primary": "#006877",
                    "secondary": "#ddb8ff",
                    "tertiary-fixed": "#ffd8e7",
                    "background": "#0c1324",
                    "surface-container-highest": "#2e3447",
                    "secondary-fixed-dim": "#ddb8ff",
                    "surface-container": "#191f31",
                    "surface-container-high": "#23293c",
                    "outline": "#859397",
                    "on-tertiary": "#620040",
                    "on-background": "#dce1fb",
                    "on-primary-fixed-variant": "#004e5a",
                    "error": "#ffb4ab",
                    "tertiary-container": "#ffa6cf",
                    "outline-variant": "#3c494c",
                    "secondary-container": "#62259b",
                    "primary-container": "#22d3ee",
                    "on-surface-variant": "#bbc9cd",
                    "primary-fixed-dim": "#2fd9f4",
                    "on-primary-fixed": "#001f25",
                    "on-secondary-fixed": "#2c0051",
                    "on-secondary-container": "#d1a1ff",
                    "error-container": "#93000a",
                    "on-primary-container": "#005763",
                    "tertiary": "#ffd0e3",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#f0dbff",
                    "primary-fixed": "#a2eeff",
                    "inverse-surface": "#dce1fb",
                    "on-error": "#690005",
                    "tertiary-fixed-dim": "#ffafd3",
                    "surface-dim": "#0c1324",
                    "on-secondary": "#490081",
                    "primary": "#8aebff",
                    "surface-container-lowest": "#070d1f",
                    "inverse-on-surface": "#2a3043",
                    "surface-bright": "#33394c",
                    "surface-tint": "#2fd9f4",
                    "on-tertiary-container": "#8f1e62",
                    "surface-variant": "#2e3447",
                    "on-tertiary-fixed-variant": "#85145a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "playfield-margin": "1rem",
                    "gutter": "1rem",
                    "component-padding-x": "1.5rem",
                    "component-padding-y": "0.75rem"
            },
            "fontFamily": {
                    "body-md": ["Sora"],
                    "data-label": ["JetBrains Mono"],
                    "data-value": ["JetBrains Mono"],
                    "display-score": ["JetBrains Mono"],
                    "body-lg": ["Sora"],
                    "headline-md": ["Sora"],
                    "headline-lg": ["Sora"],
                    "headline-lg-mobile": ["Sora"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "data-label": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "data-value": ["14px", {"lineHeight": "20px", "fontWeight": "700"}],
                    "display-score": ["48px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Gameplay CSS Effects */
        .perspective-view {
            perspective: 600px;
            perspective-origin: 50% 40%;
        }
        .grid-floor {
            transform: rotateX(75deg);
            background-image: 
                linear-gradient(to right, rgba(138, 235, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(138, 235, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 1s linear infinite;
        }
        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 50px; }
        }
        .rail-glow {
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
        }
        .motion-blur-vertical {
            filter: blur(2px);
            transform: scaleY(1.2);
        }
    </style>
</head>
<body class="bg-[#020617] text-on-surface h-screen w-screen overflow-hidden relative font-body-md selection:bg-primary selection:text-on-primary">
<!-- 3D Playfield Canvas (Background Layer) -->
<div class="absolute inset-0 perspective-view overflow-hidden z-0 flex justify-center">
<!-- Grid Floor -->
<div class="grid-floor absolute w-[200vw] h-[1536px] -bottom-[512px] left-[-50vw] bg-[#020617]"></div>
<!-- Track Container -->
<div class="absolute w-[800px] h-[1536px] -bottom-[512px] transform rotateX(75deg) transform-style-preserve-3d flex justify-center gap-16 relative">
<!-- Left Rail (Cyan) -->
<div class="w-2 h-full bg-primary text-primary rail-glow relative">
<!-- Overload Barrier -->
<div class="absolute bottom-[30%] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent border-b-[50px] border-b-error drop-shadow-[0_0_15px_rgba(255,180,171,0.8)] motion-blur-vertical"></div>
</div>
<!-- Center Rail (Purple) - Player Track -->
<div class="w-2 h-full bg-secondary text-secondary rail-glow relative">
<!-- Player Entity (Implied position at bottom) -->
<div class="absolute bottom-[10%] left-1/2 -translate-x-1/2 w-16 h-16 bg-surface-container/50 backdrop-blur-md border-2 border-secondary rounded-xl drop-shadow-[0_0_20px_rgba(221,184,255,1)] flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">rocket_launch</span>
</div>
<!-- Signal Packet (Collectible) -->
<div class="absolute bottom-[60%] left-1/2 -translate-x-1/2 w-8 h-8 bg-tertiary-container/80 backdrop-blur-sm border border-tertiary-container rounded drop-shadow-[0_0_25px_rgba(255,166,207,1)] rotate-45 motion-blur-vertical"></div>
</div>
<!-- Right Rail (Pink) -->
<div class="w-2 h-full bg-tertiary text-tertiary rail-glow relative">
<!-- Far Signal Packet -->
<div class="absolute bottom-[80%] left-1/2 -translate-x-1/2 w-6 h-6 bg-tertiary-container/80 backdrop-blur-sm border border-tertiary-container rounded drop-shadow-[0_0_15px_rgba(255,166,207,1)] rotate-45 motion-blur-vertical"></div>
</div>
</div>
<!-- Horizon Fade -->
<div class="absolute top-0 left-0 w-full h-[409px] bg-gradient-to-b from-[#020617] to-transparent z-10 pointer-events-none"></div>
</div>
<!-- TopAppBar Shell (Shared Component Mapping) -->
<div class="fixed top-0 w-full flex justify-between items-center px-playfield-margin h-16 z-50 bg-transparent transition-all duration-200">
<!-- Brand Logo -->
<div class="font-display-score text-headline-md text-primary drop-shadow-[0_0_8px_rgba(138,235,255,0.8)] tracking-tight">
            NeonSwitch Lite
        </div>
<!-- Trailing Icon Actions -->
<div class="flex items-center gap-4">
<button aria-label="Settings" class="text-on-surface-variant hover:text-primary hover:drop-shadow-[0_0_10px_rgba(138,235,255,0.6)] transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined">settings</span>
</button>
<button aria-label="Pause" class="text-primary hover:drop-shadow-[0_0_10px_rgba(138,235,255,0.6)] transition-all duration-200 active:scale-95 border border-primary/40 bg-primary/10 rounded-full p-2 drop-shadow-[0_0_15px_rgba(138,235,255,0.4)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button aria-label="Help" class="text-on-surface-variant hover:text-primary hover:drop-shadow-[0_0_10px_rgba(138,235,255,0.6)] transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</div>
<!-- HUD Overlay Layer -->
<div class="fixed inset-0 pointer-events-none z-40 p-6 flex flex-col justify-between" style="padding: 24px;">
<!-- Top HUD Area (Below TopAppBar) -->
<div class="mt-16 flex justify-between items-start">
<!-- Score Container (Left Pinned) -->
<div class="bg-surface-container/10 backdrop-blur-xl border-l-4 border-primary pl-4 py-2 pointer-events-auto">
<div class="font-data-label text-data-label text-outline uppercase tracking-wider mb-1">Score</div>
<div class="font-display-score text-display-score text-primary drop-shadow-[0_0_15px_rgba(138,235,255,0.6)]">
                    12,450
                </div>
</div>
<!-- Central Stats -->
<div class="flex gap-8 pointer-events-auto">
<!-- Combo -->
<div class="bg-surface-container/10 backdrop-blur-xl border border-secondary/40 rounded-lg px-6 py-3 flex flex-col items-center">
<div class="font-data-label text-data-label text-outline uppercase tracking-wider mb-1">Combo</div>
<div class="font-data-value text-data-value text-secondary text-2xl drop-shadow-[0_0_10px_rgba(221,184,255,0.8)]">
                        x5
                    </div>
</div>
<!-- Level -->
<div class="bg-surface-container/10 backdrop-blur-xl border border-outline-variant rounded-lg px-6 py-3 flex flex-col items-center">
<div class="font-data-label text-data-label text-outline uppercase tracking-wider mb-1">Level</div>
<div class="font-data-value text-data-value text-on-surface text-2xl">
                        08
                    </div>
</div>
</div>
<!-- Lives Indicator (Right Pinned) -->
<div class="bg-surface-container/10 backdrop-blur-xl border border-error/40 rounded-lg px-4 py-3 pointer-events-auto flex flex-col items-end">
<div class="font-data-label text-data-label text-outline uppercase tracking-wider mb-2">System Core</div>
<div class="flex gap-2">
<span class="material-symbols-outlined text-error drop-shadow-[0_0_10px_rgba(255,180,171,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-error drop-shadow-[0_0_10px_rgba(255,180,171,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-error drop-shadow-[0_0_10px_rgba(255,180,171,0.8)]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</div>
<!-- Bottom Controls Indicator -->
<div class="flex justify-center mb-8 pointer-events-auto">
<div class="bg-surface-container/20 backdrop-blur-xl border border-outline-variant rounded-full px-8 py-3 flex items-center gap-6 shadow-[0_0_20px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded border border-outline flex items-center justify-center font-data-value text-data-value text-on-surface bg-surface-highest">A</div>
<span class="font-data-label text-data-label text-outline mx-1">/</span>
<span class="material-symbols-outlined text-outline">keyboard_arrow_left</span>
</div>
<div class="w-px h-6 bg-outline-variant"></div>
<div class="font-data-label text-data-label text-primary uppercase tracking-widest drop-shadow-[0_0_8px_rgba(138,235,255,0.4)]">
                    Shift Rails
                </div>
<div class="w-px h-6 bg-outline-variant"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline">keyboard_arrow_right</span>
<span class="font-data-label text-data-label text-outline mx-1">/</span>
<div class="w-8 h-8 rounded border border-outline flex items-center justify-center font-data-value text-data-value text-on-surface bg-surface-highest">D</div>
</div>
</div>
</div>
</div>
</body></html>

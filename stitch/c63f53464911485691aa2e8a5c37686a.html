<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeonSwitch Lite - Game Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#151b2d",
                      "on-secondary-fixed-variant": "#62259b",
                      "on-tertiary-fixed": "#3d0026",
                      "on-primary": "#00363e",
                      "on-surface": "#dce1fb",
                      "surface": "#0c1324",
                      "inverse-primary": "#006877",
                      "secondary": "#ddb8ff",
                      "tertiary-fixed": "#ffd8e7",
                      "background": "#0c1324",
                      "surface-container-highest": "#2e3447",
                      "secondary-fixed-dim": "#ddb8ff",
                      "surface-container": "#191f31",
                      "surface-container-high": "#23293c",
                      "outline": "#859397",
                      "on-tertiary": "#620040",
                      "on-background": "#dce1fb",
                      "on-primary-fixed-variant": "#004e5a",
                      "error": "#ffb4ab",
                      "tertiary-container": "#ffa6cf",
                      "outline-variant": "#3c494c",
                      "secondary-container": "#62259b",
                      "primary-container": "#22d3ee",
                      "on-surface-variant": "#bbc9cd",
                      "primary-fixed-dim": "#2fd9f4",
                      "on-primary-fixed": "#001f25",
                      "on-secondary-fixed": "#2c0051",
                      "on-secondary-container": "#d1a1ff",
                      "error-container": "#93000a",
                      "on-primary-container": "#005763",
                      "tertiary": "#ffd0e3",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed": "#f0dbff",
                      "primary-fixed": "#a2eeff",
                      "inverse-surface": "#dce1fb",
                      "on-error": "#690005",
                      "tertiary-fixed-dim": "#ffafd3",
                      "surface-dim": "#0c1324",
                      "on-secondary": "#490081",
                      "primary": "#8aebff",
                      "surface-container-lowest": "#070d1f",
                      "inverse-on-surface": "#2a3043",
                      "surface-bright": "#33394c",
                      "surface-tint": "#2fd9f4",
                      "on-tertiary-container": "#8f1e62",
                      "surface-variant": "#2e3447",
                      "on-tertiary-fixed-variant": "#85145a"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "unit": "4px",
                      "playfield-margin": "1rem",
                      "gutter": "1rem",
                      "component-padding-x": "1.5rem",
                      "component-padding-y": "0.75rem"
              },
              "fontFamily": {
                      "body-md": [
                              "Sora"
                      ],
                      "data-label": [
                              "JetBrains Mono"
                      ],
                      "data-value": [
                              "JetBrains Mono"
                      ],
                      "display-score": [
                              "JetBrains Mono"
                      ],
                      "body-lg": [
                              "Sora"
                      ],
                      "headline-md": [
                              "Sora"
                      ],
                      "headline-lg": [
                              "Sora"
                      ],
                      "headline-lg-mobile": [
                              "Sora"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "data-label": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "data-value": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "700"
                              }
                      ],
                      "display-score": [
                              "48px",
                              {
                                      "lineHeight": "48px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "800"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "700"
                              }
                      ]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex items-center justify-center">
<!-- Faux Gameplay Background -->
<div class="absolute inset-0 w-full h-full z-0 bg-center bg-cover opacity-30" data-alt="A high-speed, vibrant retro-futuristic gameplay scene in a vaporwave aesthetic. Neon cyber cyan and hot pink neon grids stretch towards an infinite horizon. Abstract, glowing geometric shapes float in a midnight blue void. The scene implies intense forward momentum and high energy." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBf9evIXC-lkgAcro7CKM3hCmfzNJ_TzNQZWvxDEY4pdZr0KaCUIjeet56Zg4-yCpqKB64ExtKV2KZOq0STzNIMWPKX54bNslAE1efp-FdUUhmvdj8G0KQg5wO_u_mZwYkpxPiNFOg8ItbVTlTjawlShs81BP2CpMDw-QjVmhmUjl-WjnDPgFHQo2zAX84XAWogEvXonaDV3955IkB6RZlf4ZJMn-0ySqGF4Zo4O3sLUjfzOv10AENsasrKbUTxkZD3mh7Mn6xauxs3');"></div>
<div class="absolute inset-0 bg-background/60 backdrop-blur-md z-10"></div>
<!-- Main Settings Modal -->
<div class="relative z-50 w-full max-w-md bg-surface-container/10 backdrop-blur-xl border border-primary/40 rounded-xl shadow-[0_0_15px_rgba(138,235,255,0.2)] flex flex-col p-8 gap-8">
<!-- Header -->
<div class="flex items-center justify-between border-b border-primary/20 pb-4">
<h1 class="font-headline-lg text-headline-lg text-tertiary drop-shadow-[0_0_8px_rgba(255,208,227,0.8)]">Game Settings</h1>
<span class="material-symbols-outlined text-tertiary cursor-pointer hover:text-tertiary-fixed transition-colors">close</span>
</div>
<div class="flex flex-col gap-6">
<!-- Difficulty -->
<section class="flex flex-col gap-3">
<h2 class="font-data-label text-data-label text-primary uppercase">Game Speed</h2>
<div class="flex gap-2">
<button class="flex-1 py-2 px-4 border border-outline-variant rounded bg-surface/50 font-body-md text-body-md text-on-surface-variant hover:border-primary/50 transition-colors">Normal</button>
<button class="flex-1 py-2 px-4 border border-primary rounded bg-primary/20 font-body-md text-body-md text-primary shadow-[0_0_10px_rgba(138,235,255,0.3)] transition-colors">Fast</button>
<button class="flex-1 py-2 px-4 border border-outline-variant rounded bg-surface/50 font-body-md text-body-md text-on-surface-variant hover:border-primary/50 transition-colors">Turbo</button>
</div>
</section>
<!-- Preferences -->
<section class="flex flex-col gap-4">
<h2 class="font-data-label text-data-label text-primary uppercase">Preferences</h2>
<div class="flex items-center justify-between">
<span class="font-body-md text-body-md text-on-surface">Screen Shake</span>
<button class="w-12 h-6 rounded-full bg-primary relative transition-colors shadow-[0_0_8px_rgba(138,235,255,0.4)]">
<div class="absolute right-1 top-1 w-4 h-4 rounded-full bg-surface-container-lowest transition-transform"></div>
</button>
</div>
<div class="flex items-center justify-between">
<span class="font-body-md text-body-md text-on-surface">Motion Blur</span>
<button class="w-12 h-6 rounded-full bg-surface-container-highest border border-outline-variant relative transition-colors">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-outline transition-transform"></div>
</button>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface">Music Volume</span>
<span class="font-data-value text-data-value text-primary">80%</span>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-[80%] shadow-[0_0_8px_rgba(138,235,255,0.8)]"></div>
</div>
</div>
</section>
<!-- Input Help -->
<section class="flex flex-col gap-3 p-4 bg-surface/40 rounded-lg border border-outline-variant/50">
<h2 class="font-data-label text-data-label text-secondary uppercase mb-1">How to Play</h2>
<div class="flex items-center gap-4">
<div class="flex gap-1">
<div class="w-8 h-8 rounded border border-outline-variant flex items-center justify-center bg-surface-container-low font-data-value text-data-value text-on-surface"><span class="material-symbols-outlined text-sm">arrow_left</span></div>
<div class="w-8 h-8 rounded border border-outline-variant flex items-center justify-center bg-surface-container-low font-data-value text-data-value text-on-surface"><span class="material-symbols-outlined text-sm">arrow_right</span></div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Switch Rails</span>
</div>
<div class="flex items-center gap-4">
<div class="w-16 h-8 rounded border border-outline-variant flex items-center justify-center bg-surface-container-low font-data-value text-data-value text-on-surface text-xs">SPACE</div>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Burst</span>
</div>
</section>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<button class="w-full py-3 border border-primary bg-transparent text-primary font-body-lg text-body-lg uppercase tracking-wider hover:bg-primary/20 hover:shadow-[0_0_15px_rgba(138,235,255,0.6)] transition-all duration-200">Save Preferences</button>
<button class="w-full py-3 text-on-surface-variant font-body-md text-body-md hover:text-on-surface transition-colors">Return to Game</button>
</div>
</div>
</body></html>
